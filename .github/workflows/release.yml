name: Build & release

# Een release ontstaat automatisch bij elke push naar main die de app wijzigt.
# Het versienummer komt uit app/panasonic_scene.py (VERSION = "x.y.z"); de tag vX.Y.Z wordt aangemaakt.
# Een tag pushen (git tag v2.1.0 && git push origin v2.1.0) werkt ook en gaat dan voor.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'installer/**'
      - 'assets/icon.*'
      - '.github/workflows/release.yml'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (M1/M2/M3/M4)
            target: mac
            arch: AppleSilicon
          - os: macos-15-intel    # Intel-Macs
            target: mac
            arch: Intel
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Versie uit tag zetten
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
            python - "$V" <<'PY'
          import re, sys
          p = 'app/panasonic_scene.py'; s = open(p).read()
          open(p, 'w').write(re.sub(r'VERSION = "[^"]+"', f'VERSION = "{sys.argv[1]}"', s))
          PY
          fi
          grep -m1 '^VERSION' app/panasonic_scene.py

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: macOS — certificaat laden (enkel als secrets ingesteld zijn)
        if: matrix.target == 'mac' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build app/panasonic_scene.spec

      - name: Build-info (versies van gebundelde pakketten + architectuur)
        shell: bash
        run: |
          { echo "Panasonic Toolbox build ${{ matrix.target }}-${{ matrix.arch }}"; python -c "import platform,sys;print(platform.platform(), platform.machine(), sys.version)"; pip freeze; } > "dist/build-info-${{ matrix.target }}-${{ matrix.arch }}.txt"
          if [[ "${{ matrix.target }}" == "mac" ]]; then
            file "dist/Panasonic Toolbox.app/Contents/MacOS/Panasonic Toolbox" | tee -a "dist/build-info-${{ matrix.target }}-${{ matrix.arch }}.txt"
            if [[ "${{ matrix.arch }}" == "AppleSilicon" ]]; then file "dist/Panasonic Toolbox.app/Contents/MacOS/Panasonic Toolbox" | grep -q arm64; fi
          fi

      - name: Rooktest (server start en antwoordt)
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "mac" ]]; then BIN="dist/Panasonic Toolbox.app/Contents/MacOS/Panasonic Toolbox"; else BIN="dist/Panasonic Toolbox/Panasonic Toolbox.exe"; fi
          "$BIN" --headless --port 8799 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/ping | grep -q panasonic-scene
          curl -sf http://127.0.0.1:8799/ | grep -q "<title>Panasonic Toolbox</title>"
          curl -sf -X POST http://127.0.0.1:8799/api/quit || true

      - name: macOS — notariseren (enkel met Apple Developer-account)
        if: matrix.target == 'mac' && env.MAC_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd dist
          codesign --verify --deep --strict --verbose=2 "Panasonic Toolbox.app"
          ditto -c -k --keepParent "Panasonic Toolbox.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "Panasonic Toolbox.app"
          rm notarize.zip

      - name: macOS — DMG en ZIP
        if: matrix.target == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Panasonic Toolbox.app" "PanasonicToolbox-macOS-${{ matrix.arch }}.zip"
          mkdir dmg && cp -R "Panasonic Toolbox.app" dmg/ && ln -s /Applications dmg/Applications
          DMG="PanasonicToolbox-macOS-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Panasonic Toolbox" -srcfolder dmg -ov -format UDZO "$DMG"
          if [[ -n "$MAC_SIGN_IDENTITY" ]]; then
            codesign --sign "$MAC_SIGN_IDENTITY" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
          fi

      - name: Windows — installer en portable ZIP
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $v = (Select-String -Path app/panasonic_scene.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer/windows.iss
          Compress-Archive -Path "dist/Panasonic Toolbox" -DestinationPath "dist/PanasonicToolbox-Windows-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/build-info-*.txt
            dist/*.dmg
            dist/*.zip
            dist/*Setup.exe

  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versie bepalen
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(grep -m1 '^VERSION = ' app/panasonic_scene.py | sed -E 's/VERSION = "(.*)"/\1/')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versie: $V"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums (SHA256SUMS.txt)
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Controleren of de belangrijkste downloads er zijn
        run: |
          test -f out/PanasonicToolbox-macOS-AppleSilicon.dmg
          test -f out/PanasonicToolbox-Windows-Setup.exe
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Panasonic Toolbox ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          generate_release_notes: true
          body: |
            Download via https://seppeva.github.io/panasonicscene/
            Controleer de integriteit met SHA256SUMS.txt (de installatiescripts doen dat automatisch).
